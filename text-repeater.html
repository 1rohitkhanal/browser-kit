<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Repeater</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --accent: #4f46e5;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header { display: flex; align-items: center; justify-content: space-between; }
    .title { font-size: 18px; color: var(--text); }

    .back-btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      resize: vertical;
      font-size: 14px;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }

    input[type="number"], input[type="text"] {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    .btn {
      padding: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .primary { background: var(--accent); color: #fff; }
    .secondary { background: #111827; color: #fff; }
    .ghost { background: #fff; border: 1px solid var(--border); }

    .output {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #fafafa;
      min-height: 140px;
      white-space: pre-wrap;
      line-height: 1.5;
      word-break: break-word;
    }

    .small { font-size: 12px; color: var(--muted); }

    @media (max-width: 480px) {
      .app { padding: 12px; }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div class="title">Text Repeater</div>
    <div></div>
  </div>

  <textarea id="input" placeholder="Enter text to repeat..."></textarea>

  <div class="controls">
    <input type="number" id="count" min="1" max="1000" value="5" placeholder="Repeat count" />
    <input type="text" id="separator" placeholder="Separator (e.g. space, comma, \n)" />
  </div>

  <div class="controls">
    <button class="btn primary" onclick="process()">Repeat</button>
    <button class="btn ghost" onclick="clearAll()">Clear</button>
    <button class="btn secondary" onclick="copyText()">Copy Output</button>
  </div>

  <div id="output" class="output"></div>
  <div class="small" id="info"></div>
</div>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const info = document.getElementById('info');

  function goBack() {
    if (history.length > 1) {
      history.back();
    } else {
      window.location.href = 'index.html';
    }
  }

  function parseSeparator(val) {
    if (!val) return ' ';
    return val.replace(/\\n/g, '\n').replace(/\\t/g, '\t');
  }

  function process() {
    const text = input.value || '';
    const count = Math.max(1, Math.min(1000, parseInt(document.getElementById('count').value) || 1));
    const sepInput = document.getElementById('separator').value;
    const sep = parseSeparator(sepInput);

    if (!text) {
      output.textContent = '';
      info.textContent = '';
      return;
    }

    const parts = [];
    for (let i = 0; i < count; i++) parts.push(text);
    const result = parts.join(sep);

    output.textContent = result;
    info.textContent = `Repeated ${count} times • Length: ${result.length} characters`;
  }

  function clearAll() {
    input.value = '';
    output.textContent = '';
    info.textContent = '';
    document.getElementById('count').value = 5;
    document.getElementById('separator').value = '';
  }

  function copyText() {
    const text = output.textContent;
    if (!text) return;
    navigator.clipboard.writeText(text);
    const btn = event.target;
    const prev = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => (btn.textContent = prev), 1200);
  }
</script>

</body>
</html>

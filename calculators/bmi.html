  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/tool.css">
  <style>
    .tool-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text2);
    }

    .input-group input {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .unit-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .unit-toggle button {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg2);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .unit-toggle button.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .result-box {
      background: var(--bg2);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin-top: 20px;
    }

    .bmi-value {
      font-size: 48px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .bmi-category {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      display: inline-block;
    }

    .bmi-underweight {
      background: #e3f2fd;
      color: #1976d2;
    }

    .bmi-normal {
      background: #e8f5e9;
      color: #388e3c;
    }

    .bmi-overweight {
      background: #fff3e0;
      color: #f57c00;
    }

    .bmi-obese {
      background: #ffebee;
      color: #d32f2f;
    }

    [data-theme="dark"] .bmi-underweight {
      background: #0d47a1;
      color: #90caf9;
    }

    [data-theme="dark"] .bmi-normal {
      background: #1b5e20;
      color: #81c784;
    }

    [data-theme="dark"] .bmi-overweight {
      background: #e65100;
      color: #ffb74d;
    }

    [data-theme="dark"] .bmi-obese {
      background: #b71c1c;
      color: #ef5350;
    }

    .bmi-description {
      font-size: 13px;
      color: var(--text3);
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      .tool-section {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav id="navbar"></nav>

  <main>
    <div class="tool-container">
      <div class="tool-header">
        <h1>BMI Calculator</h1>
        <p>Calculate your Body Mass Index and health category</p>
      </div>

      <div class="tool-card">
        <div class="unit-toggle">
          <button class="active" onclick="setUnit('metric')">Metric (kg, cm)</button>
          <button onclick="setUnit('imperial')">Imperial (lb, in)</button>
        </div>

        <div class="tool-section">
          <div class="input-group">
            <label for="height">Height (<span id="heightUnit">cm</span>)</label>
            <input type="number" id="height" placeholder="Enter height" oninput="calculateBMI()">
          </div>
          <div class="input-group">
            <label for="weight">Weight (<span id="weightUnit">kg</span>)</label>
            <input type="number" id="weight" placeholder="Enter weight" oninput="calculateBMI()">
          </div>
        </div>

        <div id="result" class="result-box" style="display: none;">
          <div class="bmi-value" id="bmiValue">0</div>
          <div class="bmi-category" id="bmiCategory"></div>
          <div class="bmi-description" id="bmiDescription"></div>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="../assets/js/navbar.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script>
    let currentUnit = 'metric';

    function setUnit(unit) {
      currentUnit = unit;
      const buttons = document.querySelectorAll('.unit-toggle button');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (unit === 'metric') {
        document.getElementById('heightUnit').textContent = 'cm';
        document.getElementById('weightUnit').textContent = 'kg';
      } else {
        document.getElementById('heightUnit').textContent = 'in';
        document.getElementById('weightUnit').textContent = 'lb';
      }

      document.getElementById('height').value = '';
      document.getElementById('weight').value = '';
      document.getElementById('result').style.display = 'none';
    }

    function calculateBMI() {
      const height = parseFloat(document.getElementById('height').value);
      const weight = parseFloat(document.getElementById('weight').value);
      const resultDiv = document.getElementById('result');

      if (!height || !weight || height <= 0 || weight <= 0) {
        resultDiv.style.display = 'none';
        return;
      }

      let bmi;
      if (currentUnit === 'metric') {
        bmi = weight / ((height / 100) ** 2);
      } else {
        bmi = (weight / (height ** 2)) * 703;
      }

      let category, description, className;

      if (bmi < 18.5) {
        category = 'Underweight';
        description = 'BMI less than 18.5. Consider consulting a healthcare provider.';
        className = 'bmi-underweight';
      } else if (bmi < 25) {
        category = 'Normal Weight';
        description = 'BMI between 18.5 and 24.9. You are at a healthy weight.';
        className = 'bmi-normal';
      } else if (bmi < 30) {
        category = 'Overweight';
        description = 'BMI between 25 and 29.9. Consider a healthier lifestyle.';
        className = 'bmi-overweight';
      } else {
        category = 'Obese';
        description = 'BMI 30 or higher. Consult a healthcare provider.';
        className = 'bmi-obese';
      }

      document.getElementById('bmiValue').textContent = bmi.toFixed(1);
      document.getElementById('bmiCategory').textContent = category;
      document.getElementById('bmiCategory').className = 'bmi-category ' + className;
      document.getElementById('bmiDescription').textContent = description;
      resultDiv.style.display = 'block';
    }

    // Render navbar and footer on load
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('navbar').innerHTML = renderNavbar();
      document.getElementById('footer').innerHTML = renderFooter();
      initNavbar();
    });
  </script>
</body>

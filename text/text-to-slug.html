<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text to Slug</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --accent: #4f46e5;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header { display: flex; align-items: center; justify-content: space-between; }
    .title { font-size: 18px; color: var(--text); }

    .back-btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      resize: vertical;
      font-size: 14px;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }

    select, input[type="text"] {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    .btn {
      padding: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .primary { background: var(--accent); color: #fff; }
    .secondary { background: #111827; color: #fff; }
    .ghost { background: #fff; border: 1px solid var(--border); }

    .output {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #fafafa;
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 480px) {
      .app { padding: 12px; }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div class="title">Text to Slug</div>
    <div></div>
  </div>

  <textarea id="input" placeholder="Enter text to convert into URL slug..."></textarea>

  <div class="controls">
    <select id="separator">
      <option value="-">Hyphen (-)</option>
      <option value="_">Underscore (_)</option>
    </select>
    <input type="text" id="customSep" placeholder="Custom separator (optional)" />
  </div>

  <div class="controls">
    <button class="btn primary" onclick="process()">Generate Slug</button>
    <button class="btn ghost" onclick="clearAll()">Clear</button>
    <button class="btn secondary" onclick="copyText()">Copy</button>
  </div>

  <div id="output" class="output"></div>
</div>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');

  function goBack() {
    if (history.length > 1) {
      history.back();
    } else {
      window.location.href = 'index.html';
    }
  }

  function process() {
    let text = input.value || '';
    let sep = document.getElementById('customSep').value || document.getElementById('separator').value;

    let slug = text
      .toLowerCase()
      .trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, sep)
      .replace(new RegExp(`${sep}+`, 'g'), sep)
      .replace(new RegExp(`^${sep}|${sep}$`, 'g'), '');

    output.textContent = slug;
  }

  function clearAll() {
    input.value = '';
    output.textContent = '';
    document.getElementById('customSep').value = '';
  }

  function copyText() {
    const text = output.textContent;
    if (!text) return;
    navigator.clipboard.writeText(text);
    const btn = event.target;
    const prev = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => (btn.textContent = prev), 1200);
  }
</script>

</body>
</html>

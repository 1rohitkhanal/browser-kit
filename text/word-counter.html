<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Counter Pro</title>

<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --accent: #4f46e5;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", sans-serif;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .title {
    font-size: 18px;
    color: var(--text);
    font-weight: 600;
  }

  .back-btn {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }

  textarea {
    width: 100%;
    min-height: 160px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    resize: vertical;
    font-size: 14px;
    outline: none;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }

  .card {
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }

  .num {
    font-size: 20px;
    font-weight: bold;
    color: var(--accent);
  }

  .label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }

  .btn {
    padding: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
  }

  .primary {
    background: var(--accent);
    color: #fff;
  }

  .secondary {
    background: #111827;
    color: #fff;
  }

  .ghost {
    background: #fff;
    border: 1px solid var(--border);
  }

  .output {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: #fafafa;
    min-height: 80px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
    color: var(--text);
  }

  @media (max-width: 480px) {
    .app {
      padding: 12px;
    }
  }
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div class="title">Word Counter Pro</div>
    <div></div>
  </div>

  <textarea id="input" placeholder="Type or paste your text here... live stats will update automatically"></textarea>

  <div class="stats">
    <div class="card">
      <div id="words" class="num">0</div>
      <div class="label">Words</div>
    </div>

    <div class="card">
      <div id="chars" class="num">0</div>
      <div class="label">Characters</div>
    </div>

    <div class="card">
      <div id="charsNoSpace" class="num">0</div>
      <div class="label">Chars (No Spaces)</div>
    </div>

    <div class="card">
      <div id="sentences" class="num">0</div>
      <div class="label">Sentences</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn primary" onclick="analyze()">Analyze</button>
    <button class="btn ghost" onclick="clearAll()">Clear</button>
    <button class="btn secondary" onclick="copyText()">Copy Text</button>
  </div>

  <div id="output" class="output"></div>

</div>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');

  function goBack() {
    if (history.length > 1) history.back();
    else window.location.href = 'index.html';
  }

  function analyze() {
    const text = input.value || '';

    const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
    const chars = text.length;
    const charsNoSpace = text.replace(/\s/g, '').length;
    const sentences = (text.match(/[.!?]+/g) || []).length;

    document.getElementById('words').textContent = words;
    document.getElementById('chars').textContent = chars;
    document.getElementById('charsNoSpace').textContent = charsNoSpace;
    document.getElementById('sentences').textContent = sentences;

    // extra pro insights
    let avgWordLength = words ? (charsNoSpace / words).toFixed(2) : 0;

    output.textContent =
`📊 Text Analysis Report

Words: ${words}
Characters: ${chars}
Characters (no spaces): ${charsNoSpace}
Sentences: ${sentences}
Avg Word Length: ${avgWordLength}

Tip: Longer words usually mean more complex writing.`;
  }

  // LIVE UPDATE (best UX feature)
  input.addEventListener('input', analyze);

  function clearAll() {
    input.value = '';
    output.textContent = '';

    document.getElementById('words').textContent = 0;
    document.getElementById('chars').textContent = 0;
    document.getElementById('charsNoSpace').textContent = 0;
    document.getElementById('sentences').textContent = 0;
  }

  function copyText() {
    const text = input.value;
    if (!text) return;

    navigator.clipboard.writeText(text);

    const btn = event.target;
    const prev = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => (btn.textContent = prev), 1200);
  }

  // initial run
  analyze();
</script>

</body>
</html>

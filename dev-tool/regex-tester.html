<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta name="google-adsense-account" content="ca-pub-4267064071274874">
<meta name="google-adsense-account" content="ca-pub-4267064071274874">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regex Tester</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="/assets/global-ads.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 40px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: #fff;
      color: #333;
      text-decoration: none;
      font-weight: 600;
      transition: background .2s ease, transform .2s ease;
    }

    .back-button:hover {
      background: #eee;
      transform: translateY(-1px);
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      display: block;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: #0078d7;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background .2s ease;
    }

    button:hover {
      background: #005a9e;
    }

    .result {
      background: #f9fafb;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      color: #333;
      min-height: 80px;
      white-space: pre-wrap;
    }

    @media (max-width: 768px) {
      .tool-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <a class="back-button" href="../index.html">← Back</a>
    <h1>Regex Tester</h1>
  </div>

  <div class="tool-grid">
    <div class="panel">
      <div>
        <label for="regexInput">Regular Expression</label>
        <input type="text" id="regexInput" placeholder="Enter regex, e.g. ^[a-z]+$">
      </div>

      <div>
        <label for="testText">Test Text</label>
        <textarea id="testText" placeholder="Enter text to test..."></textarea>
      </div>

      <button onclick="testRegex()">Test Regex</button>
    </div>

    <div class="panel">
      <label>Result</label>
      <div class="result" id="result">Matches will appear here.</div>
    </div>
  </div>

  <script>
    function testRegex() {
      const regexInput = document.getElementById("regexInput").value.trim();
      const testText = document.getElementById("testText").value;
      const resultDiv = document.getElementById("result");

      if (!regexInput) {
        resultDiv.textContent = "Please enter a regex pattern.";
        return;
      }

      try {
        const regex = new RegExp(regexInput, "g"); // global match
        const matches = testText.match(regex);

        if (matches && matches.length > 0) {
          resultDiv.textContent = `Matched ${matches.length} time(s):\n` + matches.join("\n");
        } else {
          resultDiv.textContent = "No matches found.";
        }
      } catch (e) {
        resultDiv.textContent = "Invalid regex: " + e.message;
      }
    }
  </script>
</body>
</html>

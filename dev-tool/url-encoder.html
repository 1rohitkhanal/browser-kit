<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Encoder / Decoder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="/assets/global-ads.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 40px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: #fff;
      color: #333;
      text-decoration: none;
      font-weight: 600;
      transition: background .2s ease, transform .2s ease;
    }

    .back-button:hover {
      background: #eee;
      transform: translateY(-1px);
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      display: block;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
      min-height: 120px;
      resize: vertical;
    }

    .button-row {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      background: #0078d7;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background .2s ease;
    }

    button.secondary {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ccc;
    }

    button:hover {
      background: #005a9e;
    }

    button.secondary:hover {
      background: #e0e0e0;
    }

    .result {
      background: #f9fafb;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      color: #333;
      min-height: 80px;
      white-space: pre-wrap;
    }

    @media (max-width: 768px) {
      .tool-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <a class="back-button" href="../index.html">← Back</a>
    <h1>URL Encoder / Decoder</h1>
  </div>

  <div class="tool-grid">
    <div class="panel">
      <div>
        <label for="inputText">Input Text or URL</label>
        <textarea id="inputText" placeholder="Enter text or URL..."></textarea>
      </div>

      <div class="button-row">
        <button onclick="encodeText()">Encode</button>
        <button class="secondary" onclick="decodeText()">Decode</button>
        <button class="secondary" onclick="clearText()">Clear</button>
      </div>
    </div>

    <div class="panel">
      <label>Result</label>
      <div class="result" id="result">Encoded/Decoded output will appear here.</div>
    </div>
  </div>

  <script>
    function encodeText() {
      const input = document.getElementById("inputText").value;
      const resultDiv = document.getElementById("result");
      if (!input) {
        resultDiv.textContent = "Please enter text to encode.";
        return;
      }
      resultDiv.textContent = encodeURIComponent(input);
    }

    function decodeText() {
      const input = document.getElementById("inputText").value;
      const resultDiv = document.getElementById("result");
      if (!input) {
        resultDiv.textContent = "Please enter text to decode.";
        return;
      }
      try {
        resultDiv.textContent = decodeURIComponent(input);
      } catch (e) {
        resultDiv.textContent = "Invalid encoded string.";
      }
    }

    function clearText() {
      document.getElementById("inputText").value = "";
      document.getElementById("result").textContent = "Encoded/Decoded output will appear here.";
    }
  </script>
</body>
</html>

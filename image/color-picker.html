<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta name="google-adsense-account" content="ca-pub-4267064071274874">
<meta name="google-adsense-account" content="ca-pub-4267064071274874">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="/assets/global-ads.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 40px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: #fff;
      color: #333;
      text-decoration: none;
      font-weight: 600;
      transition: background .2s ease, transform .2s ease;
    }

    .back-button:hover {
      background: #eee;
      transform: translateY(-1px);
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      display: block;
    }

    input[type="color"] {
      width: 100%;
      height: 60px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .result {
      background: #f9fafb;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      color: #333;
      min-height: 80px;
      word-wrap: break-word;
    }

    .preview-box {
      width: 100%;
      height: 120px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    button {
      background: #0078d7;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background .2s ease;
    }

    button:hover {
      background: #005a9e;
    }

    @media (max-width: 768px) {
      .tool-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <a class="back-button" href="../index.html">← Back</a>
    <h1>Color Picker</h1>
  </div>

  <div class="tool-grid">
    <div class="panel">
      <div>
        <label for="colorInput">Pick a Color</label>
        <input type="color" id="colorInput" value="#0078d7">
      </div>
      <button onclick="showColor()">Show Color</button>
    </div>

    <div class="panel">
      <label>Preview</label>
      <div class="preview-box" id="previewBox"></div>
      <div class="result" id="result">HEX and RGB values will appear here.</div>
    </div>
  </div>

  <script>
    function showColor() {
      const color = document.getElementById("colorInput").value;
      const previewBox = document.getElementById("previewBox");
      const resultDiv = document.getElementById("result");

      previewBox.style.backgroundColor = color;

      // Convert HEX to RGB
      const r = parseInt(color.substr(1,2), 16);
      const g = parseInt(color.substr(3,2), 16);
      const b = parseInt(color.substr(5,2), 16);

      resultDiv.textContent = `HEX: ${color}\nRGB: (${r}, ${g}, ${b})`;
    }

    // Show default color on load
    document.addEventListener("DOMContentLoaded", showColor);
  </script>
</body>
</html>

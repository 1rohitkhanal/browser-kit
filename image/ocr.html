<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Tool (Image to Text)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 40px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: #fff;
      color: #333;
      text-decoration: none;
      font-weight: 600;
      transition: background .2s ease, transform .2s ease;
    }

    .back-button:hover {
      background: #eee;
      transform: translateY(-1px);
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      display: block;
    }

    input[type="file"] {
      width: 100%;
    }

    button {
      background: #0078d7;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background .2s ease;
    }

    button:hover {
      background: #005a9e;
    }

    .result {
      background: #f9fafb;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      color: #333;
      min-height: 120px;
      white-space: pre-wrap;
    }

    canvas {
      max-width: 100%;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    @media (max-width: 768px) {
      .tool-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <a class="back-button" href="../index.html">← Back</a>
    <h1>OCR Tool (Image to Text)</h1>
  </div>

  <div class="tool-grid">
    <div class="panel">
      <div>
        <label for="imageUpload">Upload Image</label>
        <input type="file" id="imageUpload" accept="image/*">
      </div>
      <button onclick="runOCR()">Extract Text</button>
    </div>

    <div class="panel">
      <label>Extracted Text</label>
      <div class="result" id="result">Upload an image and click Extract.</div>
    </div>
  </div>

  <!-- Tesseract.js library -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    function runOCR() {
      const fileInput = document.getElementById("imageUpload");
      const resultDiv = document.getElementById("result");

      if (!fileInput.files[0]) {
        resultDiv.textContent = "Please upload an image first.";
        return;
      }

      const file = fileInput.files[0];
      resultDiv.textContent = "Processing... please wait.";

      Tesseract.recognize(file, 'eng', {
        logger: m => console.log(m) // optional progress logging
      }).then(({ data: { text } }) => {
        resultDiv.textContent = text.trim() || "No text detected.";
      }).catch(err => {
        resultDiv.textContent = "Error: " + err.message;
      });
    }
  </script>
</body>
</html>

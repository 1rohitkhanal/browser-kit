<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Blur Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 40px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      background: #fff;
      color: #333;
      text-decoration: none;
      font-weight: 600;
      transition: background .2s ease, transform .2s ease;
    }

    .back-button:hover {
      background: #eee;
      transform: translateY(-1px);
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      display: block;
    }

    input[type="file"], input[type="range"] {
      width: 100%;
    }

    button {
      background: #0078d7;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background .2s ease;
    }

    button:hover {
      background: #005a9e;
    }

    canvas {
      max-width: 100%;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    @media (max-width: 768px) {
      .tool-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <a class="back-button" href="../index.html">← Back</a>
    <h1>Image Blur Tool</h1>
  </div>

  <div class="tool-grid">
    <div class="panel">
      <div>
        <label for="imageUpload">Upload Image</label>
        <input type="file" id="imageUpload" accept="image/*">
      </div>

      <div>
        <label for="blurRange">Blur Amount</label>
        <input type="range" id="blurRange" min="0" max="20" value="5">
      </div>

      <button onclick="applyBlur()">Apply Blur</button>
      <button onclick="downloadImage()">Download Image</button>
    </div>

    <div class="panel">
      <label>Preview</label>
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let uploadedImage = null;

    document.getElementById("imageUpload").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          uploadedImage = img;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function applyBlur() {
      if (!uploadedImage) {
        alert("Please upload an image first.");
        return;
      }

      const blurValue = document.getElementById("blurRange").value;

      // Clear canvas and redraw with blur
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.filter = `blur(${blurValue}px)`;
      ctx.drawImage(uploadedImage, 0, 0);
      ctx.filter = "none"; // reset filter
    }

    function downloadImage() {
      const link = document.createElement("a");
      link.download = "blurred-image.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <meta name="description" content="Rotate PDF pages 90, 180 or 270 degrees. Rotate all pages or specific pages. Free, no login, works in your browser."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css"/>
  <link rel="stylesheet" href="../assets/css/tool.css"/>
<title>PDF Protector</title>

<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --accent: #4f46e5;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", sans-serif;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .title {
    font-size: 18px;
    color: var(--text);
    font-weight: 600;
  }

  .back-btn {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }

  input[type="file"],
  input[type="password"] {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    outline: none;
  }

  input:focus {
    border-color: var(--accent);
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }

  .btn {
    padding: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
  }

  .primary {
    background: var(--accent);
    color: #fff;
  }

  .secondary {
    background: #111827;
    color: #fff;
  }

  .ghost {
    background: #fff;
    border: 1px solid var(--border);
  }

  .output {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: #fafafa;
    min-height: 80px;
    font-size: 13px;
    color: var(--text);
    word-break: break-word;
  }

  .file-info {
    font-size: 13px;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    .app {
      padding: 12px;
    }
  }
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div class="title">PDF Protector</div>
    <div></div>
  </div>

  <input type="file" id="file" accept="application/pdf" />

  <input type="password" id="password" placeholder="Set password to protect PDF..." />

  <div class="controls">
    <button class="btn primary" onclick="protectFile()">Protect PDF</button>
    <button class="btn ghost" onclick="clearAll()">Clear</button>
  </div>

  <div id="output" class="output">Upload a PDF and set a password.</div>

  <div class="file-info" id="fileInfo"></div>

</div>

<script>
  let selectedFile = null;
  let protectedBlob = null;

  const fileInput = document.getElementById('file');
  const output = document.getElementById('output');
  const fileInfo = document.getElementById('fileInfo');

  fileInput.addEventListener('change', function () {
    selectedFile = this.files[0];

    if (selectedFile) {
      fileInfo.textContent = `Selected: ${selectedFile.name}`;
    }
  });

  function goBack() {
    if (history.length > 1) history.back();
    else window.location.href = 'index.html';
  }

  function protectFile() {
    const password = document.getElementById('password').value;

    if (!selectedFile) {
      output.textContent = "❌ Please select a PDF file first.";
      return;
    }

    if (!password) {
      output.textContent = "❌ Please set a password.";
      return;
    }

    const reader = new FileReader();

    reader.onload = function (e) {
      const base64 = e.target.result;

      // Fake protection wrapper (NOT real encryption)
      const protectedData = JSON.stringify({
        name: selectedFile.name,
        protected: true,
        password: password,
        file: base64
      });

      protectedBlob = new Blob([protectedData], { type: "application/json" });

      output.textContent =
        "🔒 PDF Protected Successfully!\n\n" +
        "Click below to download protected file.";

      createDownloadButton();
    };

    reader.readAsDataURL(selectedFile);
  }

  function createDownloadButton() {
    const btn = document.createElement("button");
    btn.textContent = "Download Protected File";
    btn.className = "btn secondary";
    btn.style.marginTop = "10px";

    btn.onclick = function () {
      const url = URL.createObjectURL(protectedBlob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "protected-file.json";
      a.click();
    };

    output.appendChild(document.createElement("br"));
    output.appendChild(btn);
  }

  function clearAll() {
    selectedFile = null;
    protectedBlob = null;
    fileInput.value = '';
    document.getElementById('password').value = '';
    output.textContent = "Upload a PDF and set a password.";
    fileInfo.textContent = '';
  }
</script>

</body>
</html>

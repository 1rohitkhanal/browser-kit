<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <meta name="description" content="Rotate PDF pages 90, 180 or 270 degrees. Rotate all pages or specific pages. Free, no login, works in your browser."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css"/>
  <link rel="stylesheet" href="../assets/css/tool.css"/>
<title>PDF Unlocker</title>

<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --accent: #4f46e5;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", sans-serif;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .title {
    font-size: 18px;
    color: var(--text);
    font-weight: 600;
  }

  .back-btn {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }

  input[type="file"],
  input[type="password"] {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    outline: none;
  }

  input:focus {
    border-color: var(--accent);
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }

  .btn {
    padding: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
  }

  .primary {
    background: var(--accent);
    color: #fff;
  }

  .secondary {
    background: #111827;
    color: #fff;
  }

  .ghost {
    background: #fff;
    border: 1px solid var(--border);
  }

  .output {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: #fafafa;
    min-height: 80px;
    font-size: 13px;
    color: var(--text);
    word-break: break-word;
  }

  .file-info {
    font-size: 13px;
    color: var(--muted);
  }

  @media (max-width: 480px) {
    .app {
      padding: 12px;
    }
  }
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div class="title">PDF Unlocker</div>
    <div></div>
  </div>

  <input type="file" id="file" accept="application/json" />
  <input type="password" id="password" placeholder="Enter password..." />

  <div class="controls">
    <button class="btn primary" onclick="unlockFile()">Unlock PDF</button>
    <button class="btn ghost" onclick="clearAll()">Clear</button>
  </div>

  <div id="output" class="output">Upload protected file (.json)</div>
  <div class="file-info" id="fileInfo"></div>

</div>

<script>
  let fileData = null;

  const fileInput = document.getElementById('file');
  const output = document.getElementById('output');
  const fileInfo = document.getElementById('fileInfo');

  fileInput.addEventListener('change', function () {
    const file = this.files[0];

    if (!file) return;

    fileInfo.textContent = `Selected: ${file.name}`;

    const reader = new FileReader();

    reader.onload = function (e) {
      try {
        fileData = JSON.parse(e.target.result);
        output.textContent = "File loaded. Enter password to unlock.";
      } catch (err) {
        output.textContent = "❌ Invalid file format.";
      }
    };

    reader.readAsText(file);
  });

  function goBack() {
    if (history.length > 1) history.back();
    else window.location.href = 'index.html';
  }

  function unlockFile() {
    const password = document.getElementById('password').value;

    if (!fileData) {
      output.textContent = "❌ No file loaded.";
      return;
    }

    if (!password) {
      output.textContent = "❌ Enter password.";
      return;
    }

    if (password !== fileData.password) {
      output.textContent = "❌ Wrong password!";
      return;
    }

    const link = document.createElement('a');
    link.href = fileData.file;
    link.download = fileData.name || "unlocked.pdf";
    link.click();

    output.textContent =
      "🔓 PDF Unlocked Successfully!\n\nDownload started...";
  }

  function clearAll() {
    fileData = null;
    fileInput.value = '';
    document.getElementById('password').value = '';
    output.textContent = "Upload protected file (.json)";
    fileInfo.textContent = '';
  }
</script>

</body>
</html>

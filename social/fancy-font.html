<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fancy Font Generator</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --accent: #4f46e5;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .title { font-size: 18px; color: var(--text); }

    .back-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--text);
      transition: background .2s, border-color .2s;
    }
    .back-btn:hover { background: #f3f4f6; border-color: #d1d5db; }

    .input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 15px;
      outline: none;
    }
    .input:focus { border-color: var(--accent); }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fff;
    }

    .preview { color: var(--text); word-break: break-word; }
    .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

    .copy {
      border: none;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity .2s;
    }
    .copy:hover { opacity: .9; }

    @media (max-width: 480px) {
      .app { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <button class="back-btn" id="backBtn">← Back</button>
      <div class="title">Fancy Font Generator</div>
      <div style="width:72px"></div>
    </div>

    <input id="inputText" class="input" placeholder="Type your text here..." />

    <div id="list" class="list"></div>
  </div>

  <script>
    // Back button that works reliably
    const backBtn = document.getElementById('backBtn');
    backBtn.addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        // fallback (change this to your homepage if needed)
        window.location.href = 'index.html';
      }
    });

    const input = document.getElementById('inputText');
    const list = document.getElementById('list');

    const ranges = {
      normal: [0x0041, 0x0061],
      bold: [0x1D400, 0x1D41A],
      italic: [0x1D434, 0x1D44E],
      boldItalic: [0x1D468, 0x1D482],
      script: [0x1D49C, 0x1D4B6],
      gothic: [0x1D504, 0x1D51E],
      double: [0x1D538, 0x1D552],
      sans: [0x1D5A0, 0x1D5BA],
      monospace: [0x1D670, 0x1D68A]
    };

    function transform(str, type) {
      const [upper, lower] = ranges[type] || ranges.normal;
      let out = '';

      for (let ch of str) {
        const code = ch.charCodeAt(0);

        if (code >= 65 && code <= 90) {
          out += String.fromCodePoint(upper + (code - 65));
        } else if (code >= 97 && code <= 122) {
          out += String.fromCodePoint(lower + (code - 97));
        } else {
          out += ch;
        }
      }
      return out;
    }

    const styles = [
      { name: 'Bold', key: 'bold' },
      { name: 'Italic', key: 'italic' },
      { name: 'Bold Italic', key: 'boldItalic' },
      { name: 'Script', key: 'script' },
      { name: 'Gothic', key: 'gothic' },
      { name: 'Double Struck', key: 'double' },
      { name: 'Sans Serif', key: 'sans' },
      { name: 'Monospace', key: 'monospace' }
    ];

    function render() {
      const val = input.value || 'Your text';
      list.innerHTML = '';

      styles.forEach(style => {
        const text = transform(val, style.key);

        const item = document.createElement('div');
        item.className = 'item';

        const left = document.createElement('div');

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = style.name;

        const preview = document.createElement('div');
        preview.className = 'preview';
        preview.textContent = text;

        left.appendChild(label);
        left.appendChild(preview);

        const btn = document.createElement('button');
        btn.className = 'copy';
        btn.textContent = 'Copy';
        btn.onclick = () => {
          navigator.clipboard.writeText(text);
          btn.textContent = 'Copied!';
          setTimeout(() => (btn.textContent = 'Copy'), 1200);
        };

        item.appendChild(left);
        item.appendChild(btn);

        list.appendChild(item);
      });
    }

    input.addEventListener('input', render);

    render();
  </script>
</body>
</html>

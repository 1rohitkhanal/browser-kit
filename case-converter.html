<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Converter</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --accent: #4f46e5;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 18px;
      color: var(--text);
    }

    .back-btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      resize: vertical;
      font-size: 14px;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }

    button.action {
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    button.action:hover {
      opacity: 0.9;
    }

    .output {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fafafa;
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .copy-btn {
      margin-top: 6px;
      align-self: flex-end;
      padding: 6px 10px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .app { padding: 12px; }
    }
  </style>
</head>

<body>

<div class="app">
  <div class="header">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div class="title">Case Converter</div>
    <div></div>
  </div>

  <textarea id="input" placeholder="Enter your text here..."></textarea>

  <div class="buttons">
    <button class="action" onclick="toUpper()">UPPERCASE</button>
    <button class="action" onclick="toLower()">lowercase</button>
    <button class="action" onclick="toTitle()">Title Case</button>
    <button class="action" onclick="toSentence()">Sentence case</button>
  </div>

  <div id="output" class="output"></div>
  <button class="copy-btn" onclick="copyText()">Copy</button>
</div>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');

  function goBack() {
    if (history.length > 1) {
      history.back();
    } else {
      window.location.href = 'index.html';
    }
  }

  function toUpper() {
    output.textContent = input.value.toUpperCase();
  }

  function toLower() {
    output.textContent = input.value.toLowerCase();
  }

  function toTitle() {
    output.textContent = input.value
      .toLowerCase()
      .split(' ')
      .map(word => word.charAt(0).toUpperCase() + word.slice(1))
      .join(' ');
  }

  function toSentence() {
    let text = input.value.toLowerCase();
    output.textContent = text.charAt(0).toUpperCase() + text.slice(1);
  }

  function copyText() {
    navigator.clipboard.writeText(output.textContent);
    const btn = event.target;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1200);
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta name="google-adsense-account" content="ca-pub-4267064071274874">
<meta name="google-adsense-account" content="ca-pub-4267064071274874">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Countdown Timer — browser-kit</title>

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="/assets/global-ads.js"></script>
  <style>
    :root {
      --bg:#ffffff; --bg2:#f7f7f5; --border:#e5e5e3;
      --text:#1a1a18; --text2:#6b6b67;
    }
    [data-theme="dark"]{
      --bg:#111110; --bg2:#1a1a18; --border:#2e2e2c;
      --text:#ededeb; --text2:#9b9b97;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'DM Sans',sans-serif;
      background:var(--bg);
      color:var(--text);
      display:flex;
      flex-direction:column;
      height:100vh;
    }

    nav{
      display:flex;align-items:center;
      padding:14px 20px;
      border-bottom:1px solid var(--border);
      justify-content:space-between;
    }

    .back{
      padding:6px 12px;
      border:1px solid var(--border);
      border-radius:8px;
      cursor:pointer;
      background:var(--bg2);
    }

    .container{
      flex:1;
      display:grid;
      grid-template-columns:1fr 300px;
      gap:20px;
      padding:20px;
    }

    .tool{
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .box{
      border:1px solid var(--border);
      background:var(--bg2);
      padding:20px;
      border-radius:10px;
      text-align:center;
    }

    .time{
      font-size:40px;
      font-family:'Instrument Serif',serif;
      margin:10px 0;
    }

    input{
      padding:10px;
      width:100%;
      border:1px solid var(--border);
      border-radius:6px;
      margin-top:10px;
    }

    button{
      margin-top:10px;
      padding:10px;
      border:none;
      border-radius:6px;
      background:#2563eb;
      color:#fff;
      cursor:pointer;
    }

    .ad{
      border:1px dashed var(--border);
      display:flex;align-items:center;justify-content:center;
      border-radius:10px;
      color:var(--text2);
    }

    .top-ad{height:90px}
    .side-ad{height:250px}
    .bottom-ad{height:90px}

    @media(max-width:900px){
      .container{grid-template-columns:1fr}
      .side-ad{display:none}
    }
  </style>
</head>
<body>

<nav>
  <button class="back" onclick="history.back()">← Back</button>
  <h3>Countdown Timer</h3>
  <button onclick="toggleTheme()">🌙</button>
</nav>

<div class="container">
  <div>
    <div class="ad top-ad">728x90 Ad</div>

    <div class="tool">
      <div class="box">
        <h4>Set Countdown</h4>
        <input type="datetime-local" id="target">
        <button onclick="startTimer()">Start</button>
        <div class="time" id="display">00:00:00</div>
      </div>
    </div>

    <div class="ad bottom-ad">Bottom Ad</div>
  </div>

  <div class="ad side-ad">300x250 Ad</div>
</div>

<script>
let interval;

function startTimer(){
  clearInterval(interval);
  const target = new Date(document.getElementById('target').value).getTime();

  interval = setInterval(()=>{
    const now = new Date().getTime();
    const diff = target - now;

    if(diff <= 0){
      document.getElementById('display').innerText = "Time's up!";
      clearInterval(interval);
      return;
    }

    const h = Math.floor(diff / (1000*60*60));
    const m = Math.floor((diff % (1000*60*60))/(1000*60));
    const s = Math.floor((diff % (1000*60))/1000);

    document.getElementById('display').innerText =
      String(h).padStart(2,'0') + ':' +
      String(m).padStart(2,'0') + ':' +
      String(s).padStart(2,'0');
  },1000);
}

function toggleTheme(){
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('fk-theme', next);
}

// load theme
const saved = localStorage.getItem('fk-theme') || 'light';
document.documentElement.setAttribute('data-theme', saved);
</script>

</body>
</html>

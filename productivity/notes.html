<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta name="google-adsense-account" content="ca-pub-4267064071274874">
<meta name="google-adsense-account" content="ca-pub-4267064071274874">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quick Notes — browser-kit</title>
  <script src="/assets/global-ads.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:#ffffff; --bg2:#f7f7f5; --border:#e5e5e3;
      --text:#1a1a18; --text2:#6b6b67;
    }
    [data-theme="dark"]{
      --bg:#111110; --bg2:#1a1a18; --border:#2e2e2c;
      --text:#ededeb; --text2:#9b9b97;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'DM Sans',sans-serif;
      background:var(--bg);
      color:var(--text);
      display:flex;
      flex-direction:column;
      height:100vh;
    }

    nav{
      display:flex;align-items:center;
      padding:14px 20px;
      border-bottom:1px solid var(--border);
      justify-content:space-between;
    }

    .back{
      padding:6px 12px;
      border:1px solid var(--border);
      border-radius:8px;
      cursor:pointer;
      background:var(--bg2);
    }

    .container{
      flex:1;
      display:grid;
      grid-template-columns:1fr 300px;
      gap:20px;
      padding:20px;
    }

    .tool{display:flex;flex-direction:column;gap:20px}

    textarea{
      width:100%;
      height:300px;
      padding:15px;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--bg2);
      color:var(--text);
      resize:none;
      font-size:14px;
    }

    .actions{display:flex;gap:10px}

    button{
      padding:10px 14px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }

    .secondary{background:#475569}

    .ad{
      border:1px dashed var(--border);
      display:flex;align-items:center;justify-content:center;
      border-radius:10px;
      color:var(--text2);
    }

    .top-ad{height:90px}
    .side-ad{height:250px}
    .bottom-ad{height:90px}

    @media(max-width:900px){
      .container{grid-template-columns:1fr}
      .side-ad{display:none}
    }
  </style>
</head>
<body>

<nav>
  <button class="back" onclick="history.back()">← Back</button>
  <h3>Quick Notes</h3>
  <button onclick="toggleTheme()">🌙</button>
</nav>

<div class="container">
  <div>
    <div class="ad top-ad">728x90 Ad</div>

    <div class="tool">
      <textarea id="note" placeholder="Write your notes here..."></textarea>

      <div class="actions">
        <button onclick="saveNote()">Save</button>
        <button class="secondary" onclick="clearNote()">Clear</button>
        <button class="secondary" onclick="downloadNote()">Download</button>
      </div>
    </div>

    <div class="ad bottom-ad">Bottom Ad</div>
  </div>

  <div class="ad side-ad">300x250 Ad</div>
</div>

<script>
const noteEl = document.getElementById('note');

// Load saved note
noteEl.value = localStorage.getItem('fk-note') || '';

function saveNote(){
  localStorage.setItem('fk-note', noteEl.value);
  alert('Saved locally');
}

function clearNote(){
  if(confirm('Clear notes?')){
    noteEl.value='';
    localStorage.removeItem('fk-note');
  }
}

function downloadNote(){
  const blob = new Blob([noteEl.value], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'notes.txt';
  a.click();
}

function toggleTheme(){
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('fk-theme', next);
}

// load theme
const saved = localStorage.getItem('fk-theme') || 'light';
document.documentElement.setAttribute('data-theme', saved);
</script>

</body>
</html>

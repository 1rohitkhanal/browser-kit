<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Clock — browser-kit-kit</title>
<script src="/assets/global-ads.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root { --bg:#fff; --bg2:#f7f7f5; --border:#e5e5e3; --text:#1a1a18; --text2:#6b6b67; }
    [data-theme="dark"]{ --bg:#111110; --bg2:#1a1a18; --border:#2e2e2c; --text:#ededeb; --text2:#9b9b97; }

    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh}

    nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
    .back{padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);cursor:pointer; color: var(--text)}

    .container{flex:1;display:grid;grid-template-columns:1fr 300px;gap:20px;padding:20px}

    .box{border:1px solid var(--border);background:var(--bg2);padding:20px;border-radius:10px}

    .input-row{display:flex;gap:10px;flex-wrap:wrap}
    select,button{
      padding:10px;border-radius:8px;border:1px solid var(--border); background: var(--bg); color: var(--text);
    }
    button.add-btn{background:#2563eb;color:#fff;border:none;cursor:pointer}
    button.del-btn{background:transparent; border:none; cursor:pointer; color: var(--text2); font-size: 16px;}

    .clocks{margin-top:15px;display:flex;flex-direction:column;gap:10px}

    .clock{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);gap:10px
    }

    .city{font-weight:500; font-size: 14px;}
    .time{font-family:'Instrument Serif',serif;font-size:24px; min-width: 120px; text-align: right;}

    .ad{border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--text2);font-size: 12px;}
    .top-ad{height:90px; margin-bottom: 20px;}
    .side-ad{height:600px}
    .bottom-ad{height:90px; margin-top: 20px;}

    @media(max-width:900px){
      .container{grid-template-columns:1fr}
      .side-ad{display:none}
    }

    @media(max-width:500px){
      .clock{flex-direction:row; flex-wrap: wrap;}
      .time{font-size:20px; width: 100%; text-align: left; order: 3;}
      .city{flex: 1;}
    }
  </style>
</head>
<body>

<nav>
  <button class="back" onclick="history.back()">← Back</button>
  <h3>World Clock</h3>
  <button class="back" onclick="toggleTheme()">🌓</button>
</nav>

<div class="container">
  <div>
    <div class="ad top-ad">728x90 Ad (Top Banner)</div>

    <div class="box">
      <div class="input-row">
        <select id="timezoneSelect">
          <option value="Pacific/Midway">Midway Island (Samoa)</option>
          <option value="America/Honolulu">Honolulu, USA (HST)</option>
          <option value="America/Anchorage">Anchorage, USA (AKST)</option>
          <option value="America/Los_Angeles">Los Angeles, USA (PST)</option>
          <option value="America/Denver">Denver, USA (MST)</option>
          <option value="America/Chicago">Chicago, USA (CST)</option>
          <option value="America/New_York">New York, USA (EST)</option>
          <option value="America/Halifax">Halifax, Canada (AST)</option>
          <option value="America/Argentina/Buenos_Aires">Buenos Aires, Argentina</option>
          <option value="America/Sao_Paulo">São Paulo, Brazil</option>
          <option value="Atlantic/Azores">Azores (AZOT)</option>
          <option value="Europe/London">London, UK (GMT/BST)</option>
          <option value="Europe/Paris">Paris, France (CET)</option>
          <option value="Europe/Berlin">Berlin, Germany (CET)</option>
          <option value="Africa/Cairo">Cairo, Egypt (EET)</option>
          <option value="Europe/Moscow">Moscow, Russia (MSK)</option>
          <option value="Asia/Dubai">Dubai, UAE (GST)</option>
          <option value="Asia/Karachi">Karachi, Pakistan (PKT)</option>
          <option value="Asia/Kolkata">Mumbai/Delhi, India (IST)</option>
          <option value="Asia/Kathmandu" selected>Kathmandu, Nepal (NPT)</option>
          <option value="Asia/Dhaka">Dhaka, Bangladesh (BST)</option>
          <option value="Asia/Bangkok">Bangkok, Thailand (ICT)</option>
          <option value="Asia/Singapore">Singapore (SGT)</option>
          <option value="Asia/Hong_Kong">Hong Kong (HKT)</option>
          <option value="Asia/Tokyo">Tokyo, Japan (JST)</option>
          <option value="Asia/Seoul">Seoul, South Korea (KST)</option>
          <option value="Australia/Adelaide">Adelaide, Australia (ACDT)</option>
          <option value="Australia/Sydney">Sydney, Australia (AEDT)</option>
          <option value="Pacific/Auckland">Auckland, New Zealand (NZDT)</option>
          <option value="Pacific/Fiji">Fiji</option>
        </select>
        <button class="add-btn" onclick="addClock()">Add Clock</button>
      </div>

      <div class="clocks" id="clocks"></div>
    </div>

    <div class="ad bottom-ad">728x90 Ad (Bottom Banner)</div>
  </div>

  <div class="ad side-ad">300x600 Ad (Side Rectangle)</div>
</div>

<script>
const clocksEl = document.getElementById('clocks');
const select = document.getElementById('timezoneSelect');
let cities = JSON.parse(localStorage.getItem('fk-clocks') || '["Asia/Kathmandu", "America/New_York", "Europe/London"]');

function save(){ localStorage.setItem('fk-clocks', JSON.stringify(cities)); }

function getTime(zone){
  try {
    return new Date().toLocaleString('en-US', {
      timeZone: zone,
      hour:'2-digit', minute:'2-digit', second:'2-digit',
      hour12: true
    });
  } catch (e) {
    return "Error";
  }
}

function render(){
  clocksEl.innerHTML='';
  cities.forEach((c,i)=>{
    const div = document.createElement('div');
    div.className='clock';

    const city = document.createElement('span');
    city.className='city';
    // Clean up the string for display (e.g., "Asia/Kathmandu" -> "Kathmandu")
    city.textContent = c.split('/').pop().replace('_', ' ');

    const time = document.createElement('span');
    time.className='time';
    time.textContent = getTime(c);

    const del = document.createElement('button');
    del.className='del-btn';
    del.innerHTML='✕';
    del.onclick=()=>{ cities.splice(i,1); save(); render(); };

    div.append(city,time,del);
    clocksEl.appendChild(div);
  });
}

function addClock(){
  const val = select.value;
  if(!cities.includes(val)){
    cities.push(val);
    save();
    render();
  }
}

setInterval(render,1000);

function toggleTheme(){
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('fk-theme', next);
}

const saved = localStorage.getItem('fk-theme') || 'light';
document.documentElement.setAttribute('data-theme', saved);

render();
</script>

</body>
</html>
